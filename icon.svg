<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2b2b30"/>
      <stop offset="0.5" stop-color="#1b1b1f"/>
      <stop offset="1" stop-color="#101012"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="100" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4aa3ff"/>
      <stop offset="1" stop-color="#6d5efc"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- chrome tile -->
  <rect width="100" height="100" rx="20" ry="20" fill="url(#bg)"/>

  <!-- subtle grid backdrop: a calendar, implied -->
  <g opacity="0.13" stroke="#ffffff" stroke-width="1">
    <path d="M4 32h92M4 52h92M4 72h92"/>
    <path d="M28 8v84M50 8v84M72 8v84"/>
  </g>

  <!-- calendar body -->
  <g filter="url(#soft)">
    <rect x="17" y="24" width="66" height="56" rx="9" fill="url(#cell)" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.4"/>
    <!-- header bar with binder rings -->
    <path d="M17 33h66" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.4"/>
    <rect x="28" y="17" width="7" height="14" rx="3.5" fill="#8f8f9a"/>
    <rect x="65" y="17" width="7" height="14" rx="3.5" fill="#8f8f9a"/>
  </g>

  <!-- scheduled cells -->
  <g>
    <rect x="23" y="40" width="14" height="10" rx="3" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="44" y="40" width="14" height="10" rx="3" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="63" y="40" width="14" height="10" rx="3" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="23" y="56" width="14" height="10" rx="3" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="44" y="56" width="14" height="10" rx="3" fill="#ffffff" fill-opacity="0.10"/>
    <rect x="63" y="56" width="14" height="10" rx="3" fill="#ffffff" fill-opacity="0.10"/>
    <!-- the highlighted cell that the pulse passes through -->
    <rect x="23" y="69" width="14" height="9" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="1.2"/>
    <rect x="44" y="69" width="14" height="9" rx="3" fill="#6d5efc" fill-opacity="0.55"/>
    <rect x="63" y="69" width="14" height="9" rx="3" fill="none" stroke="#ffffff" stroke-opacity="0.30" stroke-width="1.2"/>
  </g>

  <!-- the pulse / heartbeat line through the calendar -->
  <g fill="none" stroke="url(#pulse)" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <path d="M13 60h11l4.5-13 6 22 5-16 4 7h40"/>
  </g>
  <circle cx="44.5" cy="69" r="3.4" fill="#ffffff"/>
</svg>
